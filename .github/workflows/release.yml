name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # ─── Rust binaries (CLI + Server) ───────────────────────────────
  build-rust:
    name: Rust (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
            features: "metal,providers"
            artifact: crabinfer-darwin-arm64
          - target: x86_64-apple-darwin
            os: macos-14
            features: "metal,providers"
            artifact: crabinfer-darwin-x64
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            features: "cpu-only,providers"
            artifact: crabinfer-linux-x64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            features: "cpu-only,providers"
            artifact: crabinfer-linux-arm64

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools (Linux ARM64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Build CLI + Server
        run: |
          cargo build --release --target ${{ matrix.target }} \
            -p crabinfer-cli -p crabinfer-server \
            --no-default-features --features "${{ matrix.features }}"
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

      - name: Package binaries
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/crabinfer dist/ 2>/dev/null || true
          cp target/${{ matrix.target }}/release/crabinfer-server dist/ 2>/dev/null || true
          cd dist && tar czf ../${{ matrix.artifact }}.tar.gz *

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.tar.gz

  # ─── Node.js native addons ─────────────────────────────────────
  build-node:
    name: Node (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: crabinfer-node
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
            features: "metal,providers"
          - target: x86_64-apple-darwin
            os: macos-14
            features: "metal,providers"
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            features: "cpu-only,providers"
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            features: "cpu-only,providers"

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Install cross-compilation tools (Linux ARM64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-node-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ matrix.target }}-cargo-

      - name: Install npm dependencies
        run: npm install

      - name: Build native addon
        run: |
          npx napi build --platform --release \
            --target ${{ matrix.target }} \
            --features ${{ matrix.features }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-${{ matrix.target }}
          path: crabinfer-node/*.node

  # ─── XCFramework (iOS + macOS) ─────────────────────────────────
  build-xcframework:
    name: XCFramework
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,aarch64-apple-darwin

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: macos-xcframework-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            macos-xcframework-cargo-

      - name: Build for iOS device (arm64)
        run: |
          cargo build --release -p crabinfer-core \
            --target aarch64-apple-ios \
            --features "metal,providers"

      - name: Build for iOS simulator (arm64)
        run: |
          cargo build --release -p crabinfer-core \
            --target aarch64-apple-ios-sim \
            --features "metal,providers"

      - name: Build for macOS (arm64)
        run: |
          cargo build --release -p crabinfer-core \
            --target aarch64-apple-darwin \
            --features "metal,providers"

      - name: Generate UniFFI Swift bindings
        run: |
          cargo run -p crabinfer-core --bin uniffi-bindgen -- \
            generate crabinfer-core/src/crabinfer.udl \
            --language swift \
            --out-dir xcframework-staging

      - name: Create XCFramework
        run: |
          mkdir -p xcframework-staging/{ios,sim,macos}

          # Create module maps and copy headers
          for dir in ios sim macos; do
            mkdir -p xcframework-staging/$dir/Headers
            cp xcframework-staging/*.h xcframework-staging/$dir/Headers/ 2>/dev/null || true
            cat > xcframework-staging/$dir/Headers/module.modulemap << 'MODMAP'
          framework module CrabInferCore {
            header "crabinfer_coreFFI.h"
            export *
          }
          MODMAP
          done

          # Copy static libraries
          cp target/aarch64-apple-ios/release/libcrabinfer_core.a xcframework-staging/ios/
          cp target/aarch64-apple-ios-sim/release/libcrabinfer_core.a xcframework-staging/sim/
          cp target/aarch64-apple-darwin/release/libcrabinfer_core.a xcframework-staging/macos/

          # Build XCFramework
          xcodebuild -create-xcframework \
            -library xcframework-staging/ios/libcrabinfer_core.a \
            -headers xcframework-staging/ios/Headers \
            -library xcframework-staging/sim/libcrabinfer_core.a \
            -headers xcframework-staging/sim/Headers \
            -library xcframework-staging/macos/libcrabinfer_core.a \
            -headers xcframework-staging/macos/Headers \
            -output CrabInferCore.xcframework

          zip -r CrabInferCore.xcframework.zip CrabInferCore.xcframework

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: xcframework
          path: CrabInferCore.xcframework.zip

  # ─── Docker image ───────────────────────────────────────────────
  build-docker:
    name: Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            crabinfer/server:${{ steps.version.outputs.VERSION }}
            crabinfer/server:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── Publish npm packages ──────────────────────────────────────
  publish-npm:
    name: Publish npm
    needs: build-node
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Download all node artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: node-*

      - name: Install dependencies
        working-directory: crabinfer-node
        run: npm install

      - name: Move artifacts to platform packages
        working-directory: crabinfer-node
        run: npx napi artifacts --artifacts-dir ../artifacts

      - name: Publish platform packages
        working-directory: crabinfer-node
        run: npx napi prepublish -t npm --skip-gh-release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish root package
        working-directory: crabinfer-node
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ─── Publish crates.io ─────────────────────────────────────────
  publish-crate:
    name: Publish crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Publish crabinfer-core
        run: |
          cargo publish -p crabinfer-core \
            --no-default-features --features "cpu-only,providers" \
            --allow-dirty
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # ─── GitHub Release ────────────────────────────────────────────
  create-release:
    name: GitHub Release
    needs: [build-rust, build-node, build-xcframework, build-docker]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Compute XCFramework checksum
        id: checksum
        run: |
          SHA=$(shasum -a 256 artifacts/xcframework/CrabInferCore.xcframework.zip | awk '{print $1}')
          echo "SHA256=$SHA" >> $GITHUB_OUTPUT

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/crabinfer-darwin-arm64/*.tar.gz
            artifacts/crabinfer-darwin-x64/*.tar.gz
            artifacts/crabinfer-linux-x64/*.tar.gz
            artifacts/crabinfer-linux-arm64/*.tar.gz
            artifacts/xcframework/CrabInferCore.xcframework.zip
          body: |
            ## Installation

            **Node.js:** `npm install @crabinfer/node@${{ steps.version.outputs.VERSION }}`

            **Rust:** `cargo add crabinfer-core@${{ steps.version.outputs.VERSION }}`

            **Homebrew:** `brew install crabinfer`

            **Docker:** `docker pull crabinfer/server:${{ steps.version.outputs.VERSION }}`

            **Swift Package Manager:**
            ```swift
            .binaryTarget(
                name: "CrabInferCore",
                url: "https://github.com/lspecian/crabinfer/releases/download/${{ github.ref_name }}/CrabInferCore.xcframework.zip",
                checksum: "${{ steps.checksum.outputs.SHA256 }}"
            )
            ```
