[package]
name = "crabinfer-server"
version = "0.1.0"
edition = "2021"
description = "OpenAI & Anthropic-compatible local inference server for CrabInfer"
license = "Apache-2.0"

[lib]
name = "crabinfer_server"
path = "src/lib.rs"

[[bin]]
name = "crabinfer-server"
path = "src/main.rs"

[features]
default = ["metal"]
metal = ["crabinfer-core/metal"]
cuda = ["crabinfer-core/cuda"]
flash-attn = ["crabinfer-core/flash-attn"]
cpu-only = ["crabinfer-core/cpu-only"]

[dependencies]
crabinfer-core = { path = "../crabinfer-core", default-features = false, features = ["providers"] }

# Candle (for GGUF loading in serving engine path)
candle-core = { git = "https://github.com/lspecian/candle", branch = "ios-metal-fix" }

# Tokenizer (for serving engine path)
tokenizers = { version = "0.21", default-features = false, features = ["fancy-regex"] }

# Web framework
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "signal"] }
tower-http = { version = "0.6", features = ["cors"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# CLI
clap = { version = "4", features = ["derive"] }

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# Streaming
tokio-stream = "0.1"

# System memory detection
libc = "0.2"
