[package]
name = "crabinfer-core"
version = "0.1.0"
edition = "2021"
description = "Safe, memory-aware LLM inference engine for Apple Silicon — local GGUF inference with Metal GPU, smart routing, and cloud fallback"
license = "Apache-2.0"
repository = "https://github.com/lspecian/crabinfer"
keywords = ["llm", "inference", "metal", "gguf", "apple-silicon"]
categories = ["science", "api-bindings"]
readme = "../README.md"

[lib]
crate-type = ["lib", "staticlib"]
name = "crabinfer_core"

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dependencies]
# Candle - ML framework (fork with iOS Metal shader fixes)
# Metal features are gated behind the "metal" Cargo feature so Linux builds work.
candle-core = { git = "https://github.com/lspecian/candle", branch = "ios-metal-fix" }
candle-nn = { git = "https://github.com/lspecian/candle", branch = "ios-metal-fix" }
candle-transformers = { git = "https://github.com/lspecian/candle", branch = "ios-metal-fix" }
candle-metal-kernels = { git = "https://github.com/lspecian/candle", branch = "ios-metal-fix", optional = true }
candle-flash-attn = { git = "https://github.com/lspecian/candle", branch = "ios-metal-fix", optional = true }
objc2-metal = { version = "0.3.1", optional = true }

# Tokenizer — use fancy-regex (pure Rust) instead of onig (C library)
# because Oniguruma's ___chkstk_darwin symbol doesn't link on iOS
tokenizers = { version = "0.21", default-features = false, features = ["fancy-regex"] }

# UniFFI for Swift bridge
uniffi = { version = "0.28", features = ["cli"] }

# Async runtime
tokio = { version = "1", features = ["rt", "sync", "macros"] }

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# Error handling
thiserror = "2"

# Half-precision float types (f16/bf16) for CUDA kernel dispatch
half = "2.7"

# Memory mapping for model files
memmap2 = "0.9"

# System calls (sysctl for device detection)
libc = "0.2"

# Serialization (for provider types and cloud API JSON)
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# HTTP client for cloud providers (blocking mode, pure-Rust TLS)
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"], optional = true }

# SHA-256 verification for downloaded models
sha2 = { version = "0.10", optional = true }

[features]
default = ["metal"]
metal = ["candle-core/metal", "candle-nn/metal", "candle-transformers/metal", "dep:candle-metal-kernels", "dep:objc2-metal"]  # Metal GPU acceleration (Apple Silicon / iOS)
cuda = ["candle-core/cuda", "candle-nn/cuda", "candle-transformers/cuda"]  # CUDA GPU acceleration (NVIDIA)
flash-attn = ["cuda", "dep:candle-flash-attn"]  # FlashAttention-2 for fast prefill (requires CUDA sm_80+)
cpu-only = []  # CPU-only mode — build without Metal or CUDA (CI)
providers = ["dep:reqwest", "dep:sha2"]  # Cloud LLM providers + model downloads
